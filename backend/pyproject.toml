[project]
name = "tripplanner"
version = "0.1.0"
description = "Backend for the local Trip Planner app"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16",
  "apscheduler>=3.11,<4",
  "fastapi>=0.120",
  "httpx>=0.28",
  "psutil>=7",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0.40",
  "tzdata>=2026.4",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
trip-planner = "tripplanner.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "pytest>=8.4",
  "respx>=0.22",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tripplanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tripplanner/migrations/versions/*" = ["E501"]
