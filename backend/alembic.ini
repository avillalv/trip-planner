# Alembic is driven by `trip-planner migrate` / `trip-planner setup-db`, which read the
# database URL from the repo-root .env. This file only locates the migration scripts.
[alembic]
script_location = %(here)s/tripplanner/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
